services:
 postgres:
   hostname: postgres
   image: postgres:16
   environment:
     POSTGRES_USER: metastore
     POSTGRES_PASSWORD: metastore123
     POSTGRES_DB: metastore
   ports:
     - "5432:5432"
   volumes:
     - pgdata:/var/lib/postgresql/data
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U metastore"]
     interval: 5s
     timeout: 5s
     retries: 5
   networks:
     - metastore-net

 hive-metastore:
   hostname: hive-metastore
   build:
     context: .
     dockerfile: Dockerfile-Hive
   environment:
     SERVICE_NAME: metastore
     DB_DRIVER: postgres
     AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
     AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
   ports:
     - "9083:9083"   # Thrift API
     - "8080:8080"   # Iceberg REST Catalog
   volumes:
     - ./conf/metastore-site.xml:/opt/hive/conf/metastore-site.xml:ro
   restart: unless-stopped
   depends_on:
     postgres:
       condition: service_healthy
     minio-init:
       condition: service_completed_successfully   
   healthcheck:
     test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
     interval: 10s
     timeout: 5s
     retries: 5
     start_period: 20s     
   networks:
     - metastore-net

 init:
   build:
     context: ./python
     dockerfile: Dockerfile
   depends_on:
     hive-metastore:
       condition: service_healthy
     minio-init:
       condition: service_completed_successfully
   networks:
     - metastore-net

 minio:
   image: minio/minio:latest
   ports:
     - "9000:9000"
     - "9001:9001"
   command: [ "server", "--console-address", ":9001", "/data" ]
   environment:
     MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
     MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
   healthcheck:
     test: ["CMD", "mc", "ready", "local"]
     interval: 5s
     timeout: 5s
     retries: 5     
   networks:
     - metastore-net

 minio-init:
    image: clickhouse/minio-mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY};
      mc mb --ignore-existing myminio/warehouse-bucket;
      exit 0;
      "
    networks:
      - metastore-net

 trino:
   image: trinodb/trino:483
   depends_on:
    - hive-metastore
   environment:
     AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
     AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
   ports:
    - "8090:8080"   # внутри контейнера — стандартный 8080
   volumes:
    - ./trino/etc/config.properties:/etc/trino/config.properties:ro
    - ./trino/etc/catalog:/etc/trino/catalog:ro
   networks:
    - metastore-net          

volumes:
 pgdata:

networks:
  metastore-net:
    driver: bridge
#   ipam:
#     config:
